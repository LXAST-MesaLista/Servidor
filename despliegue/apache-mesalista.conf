# MesaLista · sitio de Apache 2.4 (Ubuntu 24.04)
# install.sh sustituye __DOMAIN__, __WEB_DIR__, __ACME_DIR__, __API_PORT__,
# __CERT__ y __KEY__.
#
# Un solo dominio para las dos partes que viven en esta máquina:
#   https://<dominio>/api/v1/   la API de este repositorio: Apache termina
#                               HTTPS y reenvía la petición al proceso de
#                               Node.js (mesalista-api), que solo escucha en
#                               127.0.0.1:__API_PORT__
#   https://<dominio>/          la web, que se instala aparte en __WEB_DIR__
# La web añade sus propias directivas en /etc/apache2/mesalista-web.d/*.conf,
# sin tocar este archivo.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# RS-11: el registro de accesos guarda la ruta sin la cadena de consulta
# (%U en lugar de %r), así no quedan búsquedas por nombre o teléfono ni tokens.
LogFormat "%h %t \"%m %U %H\" %>s %b %D" mesalista

# RS-10: el puerto 80 solo redirige a HTTPS, salvo el desafío HTTP de
# Let's Encrypt (/.well-known/acme-challenge/), que se sirve en claro.
<VirtualHost *:80>
    ServerName __DOMAIN__
    Alias /.well-known/acme-challenge/ __ACME_DIR__/.well-known/acme-challenge/
    <Directory __ACME_DIR__>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://__DOMAIN__/$1
    ErrorLog ${APACHE_LOG_DIR}/mesalista-error.log
    CustomLog ${APACHE_LOG_DIR}/mesalista-access.log mesalista
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    DocumentRoot __WEB_DIR__

    # HTTP/2: varias peticiones por una sola conexión TLS.
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile __CERT__
    SSLCertificateKeyFile __KEY__
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off

    ErrorLog ${APACHE_LOG_DIR}/mesalista-error.log
    CustomLog ${APACHE_LOG_DIR}/mesalista-access.log mesalista

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # --- API ----------------------------------------------------------------
    # La API comprueba que la petición llegó por HTTPS con X-Forwarded-Proto,
    # y la IP real del cliente con X-Forwarded-For (mod_proxy la añade). Solo
    # se fía de ellas porque la conexión llega desde 127.0.0.1 (trusted_proxies).
    # La cabecera Authorization (el token Bearer) pasa tal cual.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyTimeout 30
    ProxyPass        /api/v1 http://127.0.0.1:__API_PORT__/api/v1 retry=0
    ProxyPassReverse /api/v1 http://127.0.0.1:__API_PORT__/api/v1
    <Location /api/v1>
        # La API solo devuelve JSON: no carga nada ni se puede incrustar.
        Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
        # El cuerpo de una petición de la API nunca pasa de 16 KB.
        LimitRequestBody 65536
    </Location>

    # Compresión de texto: el JSON de la API ocupa entre 3 y 5 veces menos.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    # --- Web ----------------------------------------------------------------
    <Directory __WEB_DIR__>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    # Directivas propias de la web (CSP, caché, reescrituras, su DirectoryIndex…).
    IncludeOptional /etc/apache2/mesalista-web.d/*.conf
</VirtualHost>
