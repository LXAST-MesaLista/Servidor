# MesaLista · sitio de nginx solo con la API (Ubuntu 24.04)
# install.sh sustituye __DOMAIN__, __ACME_DIR__, __API_PORT__, __CERT__ y __KEY__
# y lo copia en /etc/nginx/sites-available/mesalista, pero solo mientras la web
# (LXAST-MesaLista/WEB) no está instalada. Cuando lo está, install.sh usa la plantilla
# de la web (/opt/mesalista-web/despliegue/nginx-mesalista.conf), que incluye
# esta misma parte de la API: así ninguno de los dos instaladores pisa al otro.

upstream mesalista_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# RS-11: el registro de accesos guarda la ruta sin la cadena de consulta.
log_format mesalista '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

# RS-10: el puerto 80 solo redirige a HTTPS, salvo el desafío de Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    access_log /var/log/nginx/mesalista-access.log mesalista;
    error_log  /var/log/nginx/mesalista-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_DIR__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mesalista:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mesalista-access.log mesalista;
    error_log  /var/log/nginx/mesalista-error.log;

    gzip on;
    gzip_types application/json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # La API comprueba X-Forwarded-Proto y toma la IP de X-Forwarded-For; solo
    # se fía de ellas porque la conexión llega desde 127.0.0.1 (trusted_proxies).
    location /api/v1 {
        proxy_pass http://mesalista_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;

        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Sin la web todavía: la portada lo explica y el resto no existe.
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="es"><meta charset="utf-8"><title>MesaLista</title><p>La API de MesaLista funciona en <code>/api/v1/</code>. La web todavía no está instalada.</p></html>';
    }

    location / {
        return 404;
    }
}
